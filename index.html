<style>
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F1F0ED; --line:#E6E4E0;
  --ink:#141414; --muted:#6B6B6B; --mauve:#141414; --mauve-ink:#FFFFFF; --mauve-soft:#EFEEEB;
  --meadow:#141414; --copper:#141414; --teal:#141414; --teal-soft:#F0EFEC; --sage:#141414;
  --pattern:none; --danger:#B3261E; --checker-a:#F6F5F2; --checker-b:#ECEBE7;
  --shadow:0 12px 30px -20px rgba(0,0,0,.22);
  --serif:"Gloock","Bodoni Moda",Georgia,serif;
  --sans:"Outfit",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --surface:#1B1B1B; --surface-2:#242424; --line:#2E2E2E;
    --ink:#F2F2F0; --muted:#A3A3A3; --mauve:#F2F2F0; --mauve-ink:#111111; --mauve-soft:#2A2A2A;
    --meadow:#F2F2F0; --copper:#F2F2F0; --teal:#F2F2F0; --teal-soft:#2A2A2A; --sage:#F2F2F0;
    --pattern:none; --danger:#F2A39B; --checker-a:#1B1B1B; --checker-b:#252525;
    --shadow:0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1B1B1B; --surface-2:#242424; --line:#2E2E2E;
  --ink:#F2F2F0; --muted:#A3A3A3; --mauve:#F2F2F0; --mauve-ink:#111111; --mauve-soft:#2A2A2A;
  --meadow:#F2F2F0; --copper:#F2F2F0; --teal:#F2F2F0; --teal-soft:#2A2A2A; --sage:#F2F2F0;
  --pattern:none; --danger:#F2A39B; --checker-a:#1B1B1B; --checker-b:#252525;
  --shadow:0 12px 30px -20px rgba(0,0,0,.7); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background-color:var(--bg);background-image:var(--pattern);background-size:160px 240px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,canvas,svg{-webkit-user-drag:none;-webkit-touch-callout:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--mauve);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}

#app{height:100%;max-width:760px;margin:0 auto;position:relative}
#views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;-webkit-overflow-scrolling:touch}

/* nav */
.nav{position:absolute;left:18px;right:18px;bottom:4px;height:56px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:5}
.nav button{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;color:var(--muted);position:relative}
.nav button.active{color:var(--mauve)}
.nav button.active::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--mauve)}
.nav .add{width:50px;height:58px;border-radius:25px 25px 14px 14px;background:var(--mauve);color:var(--mauve-ink);transform:translateY(-14px);border:4px solid var(--bg);box-shadow:0 12px 22px -12px rgba(0,0,0,.45)}

/* buttons, chips */
.btn{height:46px;padding:0 20px;border-radius:999px;background:var(--surface-2);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--mauve);color:var(--mauve-ink)}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .n{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--mauve);color:var(--mauve-ink);border-color:var(--mauve)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}

/* rack */
.arc{position:relative;padding:14px 0 2px;color:var(--ink);text-align:center}
.arc h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1;margin:0}
.arc .count{font-size:12px;color:var(--muted);margin-top:3px;display:block}
.arc .chips{justify-content:safe center;padding-top:8px;padding-bottom:6px}
.rack-stage{position:relative;margin-top:30px}
.arch-win{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--surface-2);border-radius:999px 999px 22px 22px;pointer-events:none;overflow:hidden}
.rail{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 19%;margin-top:0;scrollbar-width:none;outline:none}
.rail::-webkit-scrollbar{display:none}
.slide{opacity:.4;flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;transform-origin:50% 12px;padding-top:4px}
.rail-bar{position:absolute;left:0;right:0;top:41.5px;height:3px;background:var(--ink);pointer-events:none}
.swing{}
@keyframes swing{0%,100%{transform:rotate(-.9deg) translateZ(0)}50%{transform:rotate(.9deg) translateZ(0)}}
.slide.flipping .hang{animation:flipin .45s ease}
@keyframes flipin{from{transform:perspective(600px) rotateY(80deg);opacity:.3}to{transform:perspective(600px) rotateY(0);opacity:1}}
.hang{position:relative;margin:0 auto;flex:none}
.hang .hk{position:absolute;top:0;color:var(--ink);z-index:0;display:block}
.hang .hk svg{display:block;width:100%;height:auto;overflow:visible}
.hang img{position:absolute;left:0;z-index:1;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.tag{margin:10px auto 0;z-index:2;width:min(84%,360px);background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 18px 14px;text-align:center;position:relative;box-shadow:var(--shadow);animation:tagin .25s ease}
@keyframes tagin{from{opacity:.4;transform:translateY(4px)}}
.tag .badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--surface-2);color:#141414;font-size:12.5px;padding:4px 13px;border-radius:999px;font-weight:500;white-space:nowrap}
.tag h3{font-weight:500;font-size:18px;margin:0;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tag .meta{margin:3px 0 0;display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:14px;color:var(--muted)}
.tag .meta .size{padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:12.5px}
.tag .meta strong{color:var(--ink);font-weight:600;font-size:16px}
.tag .price{margin:4px 0 0;color:var(--teal);font-weight:600;font-size:21px}
.mini-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.mini-tags span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:#141414}
.tag-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
.rail-pos{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}

/* empty */
.empty{text-align:center;padding:36px 28px 0;max-width:360px;margin:0 auto}
.empty .hook{width:120px;margin:0 auto 6px;color:var(--muted);opacity:.7}
.empty h2{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 20px}

/* pages */
.page-head{padding:24px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.05em;text-transform:uppercase;line-height:1;margin:0}
.search{margin:10px 20px 2px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 16px;height:48px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--ink);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px 14px;padding:8px 20px 12px}
.tile{text-align:left;display:block;width:100%}
.tile .ph{aspect-ratio:4/5;border-radius:999px 999px 20px 20px;background:var(--surface-2);display:grid;place-items:center;padding:13%}
.tile .ph img{max-width:100%;max-height:100%;object-fit:contain}
.tile .nm{font-size:14.5px;margin:8px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:12.5px;color:var(--muted);margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:18px 22px 0;display:flex;align-items:baseline;gap:10px}
.sec small{font-family:var(--sans);text-transform:none;letter-spacing:0;font-style:normal;font-size:13px;color:var(--muted)}
.ocard{text-align:left;display:block;width:100%}
.ocard .nm{font-size:15px;margin:8px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .sub{font-size:12.5px;color:var(--muted);margin:0 6px}
.mboard{aspect-ratio:4/5;border-radius:26px;background:var(--surface);position:relative;overflow:hidden}
.piece{position:absolute;transform:translate(-50%,-50%)}
.piece img{width:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px;margin:14px 20px}
.panel h2{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}
.panel p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.cat-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.cat-list li{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:18px;padding:4px 4px 4px 14px}
.cat-list input{flex:1;min-width:0;border:0;background:none;outline:none;height:40px}
.cat-list .n{font-size:13px;color:var(--muted);margin-right:4px}
.icon-btn{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:disabled{opacity:.3}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;background:var(--bg);border:1.5px solid transparent;border-radius:18px;padding:0 14px;height:46px;outline:none}
.add-row input:focus{border-color:var(--mauve)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;margin:4px 0 14px}
.check input{accent-color:var(--mauve);width:18px;height:18px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--mauve);font-weight:500;box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50}
.sheet.full{background-color:var(--bg);background-image:var(--pattern);background-size:160px 240px;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.full.open{transform:none}
.sheet-inner{display:flex;flex-direction:column;height:100%;max-width:760px;width:100%;margin:0 auto;min-height:0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px;flex:none}
.sheet-head h2{font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:.05em;text-transform:uppercase;margin:0;flex:1;text-align:center}
.title-input{flex:1;min-width:0;text-align:center;border:0;background:none;outline:none;font-family:var(--serif);font-size:20px;font-weight:400}
.title-input::placeholder{color:var(--muted)}
.sheet-body{flex:1;overflow-y:auto;padding:4px 18px 40px;min-height:0}
.sheet.mini{background:rgba(42,26,36,0);transition:background .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet.mini.open{background:rgba(42,26,36,.38)}
.mini-card{width:min(100% - 20px,460px);margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:30px;padding:22px 18px 14px;transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.mini.open .mini-card{transform:none}
.mini-card h3{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:.05em;text-transform:uppercase;margin:0 6px 4px}
.mini-card p{color:var(--muted);margin:0 6px 16px;font-size:14.5px}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{width:100%;height:52px}

/* editor */
.stage{display:flex;flex-direction:column;align-items:center}
.canvas-wrap{position:relative;max-width:100%;width:min(100%,calc(50vh * .75));aspect-ratio:3/4;border-radius:26px;overflow:hidden;touch-action:none;background-color:var(--checker-a);background-image:conic-gradient(var(--checker-b) 25%,transparent 0 50%,var(--checker-b) 0 75%,transparent 0);background-size:22px 22px}
.layer{position:absolute;inset:0;transform-origin:0 0}
.layer canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.layer canvas.ov{opacity:.5;pointer-events:none}
.frame{position:absolute;border:2px solid var(--mauve-ink);border-radius:6px;box-shadow:0 0 0 9999px rgba(42,26,36,.45),0 0 0 1px var(--mauve);pointer-events:none}
.frame i{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--mauve);border:3px solid var(--mauve-ink)}
.frame i:nth-child(1){left:-12px;top:-12px}.frame i:nth-child(2){right:-12px;top:-12px}.frame i:nth-child(3){left:-12px;bottom:-12px}.frame i:nth-child(4){right:-12px;bottom:-12px}
#e-cut{margin-top:10px}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 65%,transparent);font-size:14.5px;color:var(--ink)}
.zoom-reset{position:absolute;right:10px;top:10px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:13px;box-shadow:var(--shadow)}
.hint{font-size:13.5px;color:var(--muted);text-align:center;margin:10px 8px 0;min-height:2.6em;max-width:420px}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:10px 0 6px;background:var(--surface);border-radius:24px;padding:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:16px;font-size:11px;color:var(--muted);min-width:0}
.hgr{position:absolute;color:var(--ink);pointer-events:none}
.hgr svg{display:block;width:100%;height:auto;overflow:visible}
.tool[aria-pressed="true"]{background:var(--mauve-soft);color:var(--mauve)}
.tool:disabled{opacity:.35}
.slider{display:flex;align-items:center;gap:12px;padding:6px 8px;font-size:13.5px;color:var(--muted)}
.slider span{flex:none;width:86px}
.slider input{flex:1;accent-color:var(--mauve)}
.form{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field>span,.field>label{font-size:13px;color:var(--muted);padding-left:4px}
.field input[type=text],.field textarea{background:var(--surface);border:1.5px solid transparent;border-radius:18px;padding:12px 15px;outline:none;width:100%;resize:vertical}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--mauve)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.color-row input[type=color]{width:46px;height:46px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer}
.color-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color-row input[type=color]::-webkit-color-swatch{border:none;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.color-row input[type=color]::-moz-color-swatch{border:none;border-radius:50%}
.newcat{display:inline-flex;gap:6px}
.newcat input{height:36px;border-radius:999px;border:1.5px solid var(--mauve);background:var(--surface);padding:0 14px;outline:none;width:150px}

/* detail */
.detail-hero{background:var(--surface-2);border-radius:999px 999px 30px 30px;padding-top:56px!important;padding:22px 12px 28px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.detail-name{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;margin:18px 4px 8px}
.facts{list-style:none;padding:0;margin:8px 0 18px;background:var(--surface);border-radius:24px}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0}
.facts li span:first-child{color:var(--muted)}
.facts li span:last-child{text-align:right;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* board */
.board{position:relative;aspect-ratio:4/5;width:min(100%,calc(54vh * .8));margin:0 auto;background:var(--surface);border-radius:30px;overflow:hidden;touch-action:none;user-select:none}
.board .piece{cursor:grab}
.board .piece.sel{outline:1.5px dashed var(--mauve);outline-offset:3px;border-radius:6px}
.handle{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--mauve);color:var(--mauve-ink);display:grid;place-items:center;z-index:2;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.handle.del{right:-12px;top:-12px}
.handle.rz{right:-12px;bottom:-12px;cursor:nwse-resize}
.board-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;font-size:15px;pointer-events:none}
.board-tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.tray{display:flex;gap:10px;overflow-x:auto;padding:6px 20px 14px;margin:0 -18px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray button{flex:none;width:78px;height:96px;border-radius:20px;background:var(--surface);padding:9px;position:relative;display:grid;place-items:center}
.tray button img{max-width:100%;max-height:100%;object-fit:contain}
.tray button.on{box-shadow:inset 0 0 0 2px var(--mauve)}
.tray button.on::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--mauve)}
.tray-empty{padding:20px 4px;margin:0}
.board-sheet .chips{margin:0 -18px}

.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 20px 0}
@media (min-width:560px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.stat strong{display:block;font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.05;color:var(--teal)}
.stat span{font-size:13px;color:var(--muted)}
.tips{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{position:relative;padding-left:18px;font-size:14.5px}
.tips li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:row dense;gap:12px;margin:14px 20px 0}
.charts .panel{margin:0}
.chart{cursor:pointer;padding:16px 14px 14px;transition:box-shadow .2s}
.chart:not(.open):hover{box-shadow:var(--shadow)}
.chart h2{font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px;line-height:1.15}
.chart .donut{display:block;width:100%;max-width:150px;height:auto;margin:2px auto 0}
.chart .cap{margin:6px 0 0;font-size:12.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart.open{grid-column:1 / -1;cursor:default;padding:18px 18px 12px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chart-head h2{font-size:17px;letter-spacing:.05em;text-transform:uppercase;margin:0}
.chart.open .chart-body{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 4px}
.chart.open .donut{width:180px;max-width:none;margin:0}
.chart-note{flex:1;min-width:140px;font-size:13px;margin:0}
.donut .dn{font-family:var(--serif);font-size:9px;fill:var(--ink)}
.donut .dl{font-size:3.2px;fill:var(--muted);font-family:var(--sans)}
.legend{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.legend .row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 6px;border-radius:12px;text-align:left;font-size:15px}
.legend .row:not(:disabled):hover{background:var(--bg)}
.legend .row:disabled{cursor:default}
.legend .sw{width:13px;height:13px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.legend .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .ct{font-variant-numeric:tabular-nums}
.legend .pc{color:var(--muted);font-size:13px;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.slice-items{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px 29px;scrollbar-width:none}
.slice-items:empty{display:none}
.slice-items::-webkit-scrollbar{display:none}
.slice-items button{flex:none;width:46px;height:56px;border-radius:12px;background:var(--bg);padding:5px;display:grid;place-items:center}
.slice-items img{max-width:100%;max-height:100%;object-fit:contain}
.slice-items .more{align-self:center;font-size:13px;color:var(--muted);padding:0 6px}
.paste-zone{min-height:96px;border:1.5px dashed var(--line);border-radius:20px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.paste-zone:focus{border-color:var(--ink)}
.canvas-wrap.picking{cursor:crosshair;box-shadow:0 0 0 3px var(--ink)}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.side-row .seg{flex:1;max-width:220px}
.side-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--surface-2);color:var(--muted);font-size:14px}
.side-empty p{margin:0;max-width:220px}
.slider.trim span{width:auto;font-size:12.5px}
.details-row{display:flex;gap:8px;flex-wrap:wrap}
.dthumb{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dx{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(20,20,20,.7);color:#fff;display:grid;place-items:center}
.dadd{width:76px;height:76px;border-radius:16px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.sheet.full.lb{background:#0E0E0E;background-image:none}
.lightbox{position:relative;width:100%;height:100%;display:grid;place-items:center;touch-action:none;overflow:hidden}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform}
.lb-x,.lb-prev,.lb-next{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lb-x{top:14px;right:14px}.lb-prev{left:12px;top:50%}.lb-next{right:12px;top:50%;transform:scaleX(-1)}
.lb-n{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#ddd;font-size:13px;margin:0}
.ctabs{margin:12px 20px 0;max-width:320px}
.ctabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wcard{display:flex;flex-direction:column;gap:6px}
.wph{color:var(--muted)}
.wlink{align-self:flex-start;margin-left:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-decoration:none;color:var(--ink);height:32px;font-size:13px;padding:0 12px}
.wish-photo{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);border-radius:999px 999px 26px 26px;padding:40px 16px 16px;min-height:200px;justify-content:center}
.wish-photo img{max-height:42vh;max-width:100%;object-fit:contain;border-radius:12px}
.wish-add-photo{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:14.5px;padding:30px}
.loupe{position:fixed;z-index:120;width:132px;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.loupe canvas{display:block;width:132px;height:132px;border-radius:50%;border:3px solid #fff;background:#fff}
.loupe-lab{margin:6px auto 0;display:flex;align-items:center;justify-content:center;gap:6px;background:#141414;color:#fff;border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;width:max-content;font-variant-numeric:tabular-nums}
.loupe-sw{width:16px;height:16px;border-radius:50%;border:1.5px solid #fff}
.side-acts{display:flex;gap:6px}
.btn.icon-only{width:38px;padding:0}
.dx.dr{top:auto;bottom:4px}
.colors-panel{margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px 10px}
.colors-panel summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-weight:500;cursor:pointer}
.colors-panel summary::-webkit-details-marker{display:none}
.slider.adj{padding:4px 0}
.slider.adj span{width:62px;font-size:12.5px}
.slider.adj span:last-child{text-align:right}
.fx-btn{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);z-index:3}
.fx-btn.on{background:var(--ink);color:var(--mauve-ink)}
.fx-panel{width:100%;max-width:420px;margin:10px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 14px 8px}
.fx-panel .slider.adj span{width:62px;font-size:12.5px}
.dress-body{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding-top:0}
.dress-body>*{flex-shrink:0}
.dress-steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.dress-steps::-webkit-scrollbar{display:none}
.dress-steps button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.dress-steps button.done{color:var(--ink)}
.dress-steps button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--mauve-ink)}
.dress-canvas{position:relative;align-self:center;background:var(--surface-2);border-radius:999px 999px 26px 26px;overflow:hidden;touch-action:pan-y;flex:none}
.dress-layers{position:absolute;inset:0}
.dl{position:absolute;object-fit:contain;pointer-events:none;transition:transform .18s ease,opacity .18s ease}
.dl.active{filter:drop-shadow(0 0 0 transparent)}
.dl.in-r{animation:dlinr .26s ease}.dl.in-l{animation:dlinl .26s ease}
@keyframes dlinr{from{transform:translateX(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes dlinl{from{transform:translateX(-46px);opacity:0}to{transform:none;opacity:1}}
.dress-arrow{position:absolute;top:38%;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);z-index:20}
.dress-arrow.l{left:8px}.dress-arrow.r{right:8px;transform:scaleX(-1)}
.dress-name{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;font-size:13px;font-weight:500;z-index:20}
.dress-name:empty{display:none}
.dress-hint{text-align:center;color:var(--muted);font-size:13px;margin:0}
.dress-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.dress-strip::-webkit-scrollbar{display:none}
.dthumb2{flex:none;width:58px;height:70px;border-radius:29px 29px 12px 12px;background:var(--surface-2);display:grid;place-items:center;padding:7px;font-size:12px;color:var(--muted)}
.dthumb2 img{max-width:100%;max-height:100%;object-fit:contain}
.dthumb2.none{border:1.5px dashed var(--line);background:transparent}

    back: i.back && (IMG_RE.test(i.back.img || '') || (IMG_RE.test(i.back.imgJ || '') && (IMG_RE.test(i.back.imgA || '') || IMG_RE.test(i.back.imgM || '')))) ? { img: IMG_RE.test(i.back.img || '') ? i.back.img : '', imgJ: IMG_RE.test(i.back.imgJ || '') ? i.back.imgJ : undefined, imgA: IMG_RE.test(i.back.imgA || '') ? i.back.imgA : undefined, imgM: IMG_RE.test(i.back.imgM || '') ? i.back.imgM : undefined, orig: IMG_RE.test(i.back.orig || '') ? i.back.orig : undefined, mask: IMG_RE.test(i.back.mask || '') ? i.back.mask : undefined, aspect: +i.back.aspect || 0.8, fx: i.back.fx && typeof i.back.fx === 'object' ? { adj: Object.fromEntries(['b', 's', 'w', 'c'].map(k => [k, clamp(+(i.back.fx.adj || {})[k] || 0, -50, 50)])), pop: !!i.back.fx.pop } : null, hang: (i.back.hang && [i.back.hang.cx, i.back.hang.ty, i.back.hang.w].every(v => typeof v === 'number' && isFinite(v))) ? { type: ['hanger', 'clip', 'hook'].includes(i.back.hang.type) ? i.back.hang.type : 'hanger', cx: clamp(i.back.hang.cx, -1, 2), ty: clamp(i.back.hang.ty, -1, 2), w: clamp(i.back.hang.w, 0.05, 3) } : undefined } : null
  }));
  const cats = (Array.isArray(data.categories) ? data.categories : []).filter(c => c && typeof c.id === 'string' && typeof c.name === 'string').map(c => ({ id: c.id, name: c.name.slice(0, 60) }));
  const outfits = (Array.isArray(data.outfits) ? data.outfits : []).filter(o => o && typeof o.id === 'string' && Array.isArray(o.pieces)).map(o => ({
    id: o.id, name: str(o.name), created: +o.created || Date.now(), updated: +o.updated || Date.now(),
    pieces: o.pieces.filter(p => p && typeof p.itemId === 'string').map(p => ({ k: uid(), itemId: p.itemId, x: clamp(+p.x || 0.5, 0, 1), y: clamp(+p.y || 0.5, 0, 1), w: clamp(+p.w || 0.4, 0.04, 1.5), z: +p.z || 1 }))
  }));

  const mode = await choose('Import backup', `${items.length} pieces, ${outfits.length} outfits and ${wishes.length} wishes found.`, [{ v: 'merge', label: 'Add to my closet', primary: true }, { v: 'replace', label: 'Replace my closet', danger: true }]);

  } catch (e) { console.error(e); toast("Import stopped partway. Your device may be out of space."); renderAll(); }
}

/* ---------- global events ---------- */
document.addEventListener('click', async e => {
  if (e.target.closest('#sheets')) return;
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const ct = e.target.closest('[data-ctab]'); if (ct) { S.ctab = ct.dataset.ctab; renderClosetResults(); return; }
  const wsh = e.target.closest('[data-wish]'); if (wsh) { openWish(S.wish.find(x => x.id === wsh.dataset.wish)); return; }
  if (e.target.closest('.wlink')) return;
  const c = e.target.closest('[data-cat]');
  if (c) { const sc = c.closest('[data-scope]')?.dataset.scope; if (sc === 'rack') { S.rackCat = c.dataset.cat; S.rackIndex = 0; renderRack(); } else if (sc === 'closet') { S.closetCat = c.dataset.cat; renderClosetResults(); } return; }
  const t = e.target.closest('[data-theme-opt]'); if (t) { applyTheme(t.dataset.themeOpt); renderSettings(); return; }
  const mv = e.target.closest('[data-catmove]');
  if (mv) { const i = S.cats.findIndex(x => x.id === mv.dataset.id), j = i + +mv.dataset.catmove; if (j >= 0 && j < S.cats.length) { [S.cats[i], S.cats[j]] = [S.cats[j], S.cats[i]]; await saveCats(); renderAll(); } return; }
  const md = e.target.closest('[data-matdel]');
  if (md) { S.customMats = S.customMats.filter(m => m !== md.dataset.matdel); await saveMats(); renderSettings(); return; }
  const dc = e.target.closest('[data-catdel]');
  if (dc) { const cat = S.cats.find(x => x.id === dc.dataset.catdel); if (!cat) return; const n = S.items.filter(i => i.cat === cat.id).length; if (!(await confirmDanger(`Delete ${cat.name}?`, n ? `Its ${n} ${n === 1 ? 'piece moves' : 'pieces move'} to Uncategorized.` : 'No pieces use it.', 'Delete category'))) return; S.cats = S.cats.filter(x => x.id !== cat.id); if (S.rackCat === cat.id) S.rackCat = 'all'; if (S.closetCat === cat.id) S.closetCat = 'all'; await saveCats(); renderAll(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'add': openAdd(); break;
    case 'closet-add': if (S.ctab === 'wish') openWish(null); else openAdd(); break;
    case 'wish-add': openWish(null); break;
    case 'detail': openDetail(byId(a.dataset.id)); break;
    case 'flip': { const it = byId(a.dataset.id); if (!it?.back) break; S.flip[it.id] = !S.flip[it.id]; const sl = $(`.slide[data-id="${it.id}"]`); if (sl) { const [mw, mh] = rackDims(); sl.innerHTML = hangSideHTML(it, S.flip[it.id] ? 'back' : 'front', mw, mh); sl.classList.remove('flipping'); void sl.offsetWidth; sl.classList.add('flipping'); setTimeout(() => sl.classList.remove('flipping'), 500); } renderTag(it); break; }
    case 'style': openBoard(null, a.dataset.id); break;
    case 'new-outfit': openBoard(); break;
    case 'mix': openMix(); break;
    case 'open-outfit': openBoard(S.outfits.find(o => o.id === a.dataset.id)); break;
    case 'add-cat': { const inp = $('#new-cat'); const name = inp.value.trim(); if (!name) { inp.focus(); return; } S.cats.push({ id: uid(), name: name.slice(0, 60) }); await saveCats(); renderAll(); toast(`Added ${name}`); break; }
    case 'export': exportBackup(); break;
    case 'restore-snap': restoreSnapshot(); break;
    case 'del-orig': deleteOriginals(); break;
    case 'import': $('#pick-backup').click(); break;
    case 'wipe': if (await confirmDanger('Delete everything?', 'Every piece, outfit, and category on this device will be gone. A safety copy is kept so you can undo this once from Settings.', 'Delete everything')) { await takeSnapshot('you deleted everything'); await safe(Promise.all(['items', 'outfits', 'meta', 'wish', 'edits'].map(s => store.clear(s)))); S.items = []; S.outfits = []; S.wish = []; S.cats = DEFAULT_CATS(); S.customMats = []; await saveCats(); S.rackCat = S.closetCat = 'all'; renderAll(); toast('Closet cleared'); } break;
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'keep-orig') { try { localStorage.setItem('closet-keeporig', e.target.checked ? '1' : '0'); } catch {} return; }
  const r = e.target.closest('[data-rename]');
  if (r) { const c = S.cats.find(x => x.id === r.dataset.rename); const v = r.value.trim(); if (c && v && v !== c.name) { c.name = v.slice(0, 60); await saveCats(); renderRack(); renderClosetResults(); } else if (c) r.value = c.name; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'new-cat') { e.preventDefault(); $('[data-act="add-cat"]').click(); } if (e.key === 'Enter' && e.target.matches('[data-rename]')) e.target.blur(); });

$('#pick-backup').addEventListener('change', e => { const f = e.target.files?.[0]; e.target.value = ''; if (f) importBackup(f); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'rack') renderRack(); }, 200); });


async function trimTop(it) {
  const im = await loadImage(it.img), w = im.naturalWidth, h = im.naturalHeight, c = mk(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, w, h).data; let top = 0;
  outer: for (; top < h; top++) for (let i = 0; i < w; i++) if (d[(top * w + i) * 4 + 3] > 12) break outer;
  if (top < 2 || top >= h - 2) return false;
  const o = mk(w, h - top); o.getContext('2d').drawImage(c, 0, top, w, h - top, 0, 0, w, h - top);
  let img = it.img.startsWith('data:image/webp') ? o.toDataURL('image/webp', 0.9) : ''; if (!img.startsWith('data:image/webp')) img = o.toDataURL('image/png');
  it.img = img; it.aspect = w / (h - top); return true;
}
async function migrate() {
  let changed = false;
  for (const it of S.items) {
    if (it.v >= 10) continue;
    try {
      if (!(it.v >= 2) && it.img) await trimTop(it);
      const t = hangerType(it), g = it.hang;
      if (t !== 'none' && !(g && g.cx != null && (g.type || 'hanger') === t)) it.hang = await hangOf(await fullSrc(it), t);
    } catch (e) { console.error(e); }
    try { await compactSide(it); if (it.back) await compactSide(it.back); await prepItem(it); } catch (e) { console.error(e); }
    it.v = 10; await safe(putItem(it)); const lit = lighten(it).light; Object.keys(it).forEach(k => { if (!(k in lit)) delete it[k]; }); Object.assign(it, lit); changed = true;
  }
  if (changed) renderAll();
}
/* stop accidental page zoom (pinch on the page, double-tap); pinch inside the photo editor and detail photos still works */

const navIcons = { rack: 'hanger', closet: 'grid', outfits: 'layers', insights: 'pie' };
$$('.nav [data-go]').forEach(b => { b.innerHTML = ic(navIcons[b.dataset.go], 25); });

(async () => {
  try { if (!window.indexedDB) throw new Error('no idb'); await openDB(); }

  try {

    await Promise.all(items.map(it => prepItem(it).catch(() => it))); S.items = items.filter(it => hasCut(it)); S.outfits = outfits; S.wish = wish.sort((a, b) => b.created - a.created); sortItems(); sortOutfits();
    const c = meta.find(m => m.id === 'categories'); S.cats = c ? c.list : DEFAULT_CATS(); if (!c) await saveCats();
